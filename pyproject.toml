[project]
name = "tstomkv"
version = "1.0.0"
description = "A simple tool to convert TS files to MKV format over the network."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "customtkinter>=5.2.2",
    "fabric>=3.2.2",
    "pygobject>=3.56.1",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "types-toml>=0.10.8.20240310",
]

[project.scripts]
kodimkv = "tstomkv.cli:kodimkv"
tvhmkv = "tstomkv.cli:tvhmkv"
gtk4titles = "tstomkv.gtk4:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
